[package]
name = "sx-plugin-office"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "BSD-3-Clause"
description = "Built-in Office document handler for sx (DOCX, XLSX, PPTX, ODT, DOC, XLS, PPT)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sx-plugin-api = { workspace = true }
sx-core       = { workspace = true }
stabby        = { workspace = true }
log           = { workspace = true }
env_logger    = { workspace = true }
